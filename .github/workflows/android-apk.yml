name: EdgePilot Android test APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  assemble-debug:
    name: Build debug APK (not production signed)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble Android test APK
        run: gradle --no-daemon --stacktrace -p android :app:assembleDebug
      - name: Upload privately to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EdgePilot-v0.19.12-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
