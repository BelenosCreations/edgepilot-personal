name: EdgePilot Android test APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  assemble-debug:
    name: Build debug APK (not production signed)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble Android test APK
        run: gradle --no-daemon --stacktrace -p android :app:assembleDebug
      - name: Compile unchanged unsigned owner release (no artifact)
        run: gradle --no-daemon --stacktrace -p android :app:assembleRelease
      - name: Compile separate unsigned staging package (no artifact)
        run: gradle --no-daemon --stacktrace -p android :app:assembleStaging "-PedgePilotStagingHost=ci-only.belenoscreations.biz"
      - name: Verify production and staging have distinct Android package IDs
        shell: bash
        run: |
          set -euo pipefail
          tools="${ANDROID_HOME}/build-tools/35.0.0"
          owner="android/app/build/outputs/apk/debug/app-debug.apk"
          release="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          staging="android/app/build/outputs/apk/staging/app-staging-unsigned.apk"
          test -s "$owner"
          test -s "$release"
          test -s "$staging"
          "$tools/aapt" dump badging "$owner" | grep -Eq "^package: name='com[.]edgepilot[.]mobile' versionCode='1917' "
          "$tools/aapt" dump badging "$release" | grep -Eq "^package: name=\'com[.]edgepilot[.]mobile\' versionCode=\'1917\' "
          "$tools/aapt" dump badging "$staging" | grep -Eq "^package: name='com[.]edgepilot[.]mobile[.]staging' versionCode='1917' "
      - name: Upload privately to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EdgePilot-v0.19.17-public-onboarding-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
