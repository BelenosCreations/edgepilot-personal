name: EdgePilot tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: edgepilot-ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  unit-and-http:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Python unit and Flask route tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Compile backend sources
        run: python -m compileall -q backend
      - name: Validate browser JavaScript
        run: |
          node --check backend/static/assets/app.js
          node --check backend/static/assets/identity.js
