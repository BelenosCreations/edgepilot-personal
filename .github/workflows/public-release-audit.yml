name: Public release history preflight
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/public-release-audit.yml'
      - 'tools/public_git_history_scan.py'
permissions:
  contents: read
concurrency:
  group: public-release-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan-history:
    name: Scan all reachable Git objects without printing secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: History and credential preflight
        run: python tools/public_git_history_scan.py
